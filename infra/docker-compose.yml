services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO init — tạo buckets lần đầu ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - backend
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        mc mb --ignore-existing local/ocr-data &&
        echo 'Buckets ready'
      "

  # ── MLflow Tracking Server ────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── FastAPI ───────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # ── Container's own access (internal docker network names) ──
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DATA: ocr-data
      HF_TOKEN: ${HF_TOKEN}
      HF_REPO_DATA: ${HF_REPO_DATA}
      WANDB_API_KEY: ${WANDB_API_KEY}
      WANDB_PROJECT: ${WANDB_PROJECT}
      WANDB_ENTITY: ${WANDB_ENTITY}
      # ── Public endpoints forwarded to remote Vast.ai instances ──
      # (remote can't resolve docker network names like "minio")
      PUBLIC_MLFLOW_TRACKING_URI: ${PUBLIC_MLFLOW_TRACKING_URI}
      PUBLIC_MINIO_ENDPOINT: ${PUBLIC_MINIO_ENDPOINT}
      # ── Vast.ai orchestration (training/deploy triggers, onstart-based) ──
      VAST_API_KEY: ${VAST_API_KEY}
      GPU_TEMPLATE_ID: ${GPU_TEMPLATE_ID}
      GPU_TRAIN_TEMPLATE_ID: ${GPU_TRAIN_TEMPLATE_ID}
      TRAIN_DOCKER_IMAGE: ${TRAIN_DOCKER_IMAGE}
      GIT_REPO_URL: ${GIT_REPO_URL}
      REMOTE_WORK_DIR: ${REMOTE_WORK_DIR}
      # Fast post-train CER+loc eval: HF dataset repo holding vllm-venv.tar.zst
      # (same cache the Colab pool uses). Empty → train.py prints the manual
      # `--recover` hint instead of running the vLLM eval phase.
      VLLM_VENV_REPO: ${VLLM_VENV_REPO:-}
      VLLM_VENV_PYTHON: ${VLLM_VENV_PYTHON:-/content/vllm-venv/bin/python}
    volumes:
      # Mount source so code changes apply on `up -d` (recreate) without rebuild
      - ../src:/app/src:ro
      # Shared serving state file written by the host scaler (colab_pool_scaler.py)
      - /opt/ocr:/opt/ocr
    ports:
      - "8000:8000"
    networks:
      - backend

  # ── Training watchdog (auto-recovery for dead train instances) ─────────────
  training-watchdog:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: ["python", "-m", "src.serving.training_watchdog"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      VAST_API_KEY: ${VAST_API_KEY}
      WATCHDOG_API_BASE: http://fastapi:8000
      WATCHDOG_POLL_INTERVAL_S: ${WATCHDOG_POLL_INTERVAL_S:-60}
      WATCHDOG_GRACE_CHECKS: ${WATCHDOG_GRACE_CHECKS:-3}
      WATCHDOG_MAX_RETRIES: ${WATCHDOG_MAX_RETRIES:-3}
      VAST_READY_TIMEOUT_S: ${VAST_READY_TIMEOUT_S:-900}
    volumes:
      - ../src:/app/src:ro
    networks:
      - backend

  # ── Nginx Load Balancer ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # LB config generated by the host scaler (split_clients → CF tunnels);
      # overrides the image's default server. Replaces the old Vast upstream.conf.
      - /opt/ocr/nginx/ocr_lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # targets.json written by the host scaler (colab_pool_scaler.py) as the
      # vLLM pool scales up/down — shared via /opt/ocr.
      - /opt/ocr/prometheus/targets.json:/etc/prometheus/targets.json
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - backend

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Allow embedding dashboards in the Streamlit UI iframe + anonymous view
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - backend

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
